<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এডমিন লগইন - ইউনাইটেড ভলান্টিয়ার্স ফাউন্ডেশন</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen justify-between">

    <!-- Header Section -->
    <header class="bg-white shadow-sm py-3 px-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-green-600 rounded-full flex items-center justify-center text-white font-bold">UVF</div>
            <div>
                <h1 class="text-sm font-bold text-gray-800">ইউনাইটেড ভলান্টিয়ার্স ফাউন্ডেশন</h1>
                <p class="text-xs text-red-600">মানুষের জন্য মানবতার পথে</p>
            </div>
        </div>
        <button class="bg-red-700 text-white px-3 py-1.5 rounded text-sm flex items-center space-x-1">
            <span>☰ মেনু</span>
        </button>
    </header>

    <!-- Main Login Card Section -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-md border border-gray-100 text-center">
            <!-- Lock Icon -->
            <div class="flex justify-center mb-4">
                <div class="text-red-500 text-3xl">🔒</div>
            </div>
            
            <h2 class="text-xl font-bold text-gray-900 mb-2">এডমিন লগইন</h2>
            <p class="text-sm text-gray-500 mb-6">এডমিন প্যানেলে প্রবেশ করতে ইউজারনেম ও পাসওয়ার্ড দিন।</p>

            <!-- Form -->
            <form class="space-y-4 text-left">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ইউজারনেম</label>
                    <input type="text" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">পাসওয়ার্ড</label>
                    <input type="password" class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500">
                </div>
                <button type="submit" class="w-full bg-[#c97a7a] hover:bg-red-700 text-white font-medium py-2.5 rounded-lg transition duration-200">
                    প্রবেশ করুন
                </button>
            </form>
        </div>
    </main>

    <!-- Footer Section -->
    <footer class="bg-[#0b1329] text-white text-center py-6 px-4">
        <p class="text-xs text-gray-400 mb-2">সর্বশেষ হালনাগাদ: ৩ নভেম্বর, ২০২৬ এ ১০:১৫:৪৪ PM</p>
        <div class="flex justify-center items-center space-x-2">
            <span class="w-8 h-8 bg-green-600 rounded-full flex items-center justify-center text-xs">UVF</span>
            <div class="text-left">
                <p class="text-sm font-bold">ইউনাইটেড ভলান্টিয়ার্স ফাউন্ডেশন</p>
                <p class="text-xs text-red-400">মানুষের জন্য মানবতার পথে</p>
            </div>
        </div>
    </footer>

</body>
</html>
